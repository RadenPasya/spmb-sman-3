{% extends 'base.html' %}
{% block title %}Form Daftar Ulang - SMAN 3 Tambun Selatan{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
    <h2 class="text-xl font-bold text-slate-900 border-b pb-3 mb-6">Formulir Daftar Ulang Siswa Baru</h2>

    <form action="/daftar" method="POST" class="space-y-6">
      
      <!-- Data Diri -->
      <div class="space-y-4">
        <h3 class="text-sm font-bold text-blue-900 uppercase tracking-wider">1. Data Diri Calon Siswa</h3>
        
        <div>
          <label class="block text-sm font-semibold mb-1">Nama Lengkap</label>
          <input type="text" name="nama" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="Sesuai Ijazah SMP" required>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">NISN</label>
            <input type="number" name="nisn" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="10 Digit NISN" required>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">NIK (Sesuai KK)</label>
            <input type="number" name="nik" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="16 Digit NIK" required>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold mb-1">Tempat Lahir</label>
            <input type="text" name="tempat_lahir" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="Kota / Kab" required>
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">Tanggal Lahir</label>
            <input type="date" name="tgl_lahir" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Jenis Kelamin</label>
          <select name="jk" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
            <option value="">-- Pilih Jenis Kelamin --</option>
            <option value="Laki-laki">Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>
      </div>

      <!-- Asal Sekolah -->
      <div class="space-y-4 pt-4 border-t border-slate-100">
        <h3 class="text-sm font-bold text-blue-900 uppercase tracking-wider">2. Asal Sekolah & Jalur Masuk</h3>
        
        <div>
          <label class="block text-sm font-semibold mb-1">Nama SMP / MTs Asal</label>
          <input type="text" name="smp_asal" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="Contoh: SMPN 1 Tambun Selatan" required>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">Jalur Masuk PPDB</label>
          <select name="jalur_ppdb" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
            <option value="">-- Pilih Jalur PPDB --</option>
            <option value="Zonasi">Zonasi</option>
            <option value="Afirmasi">Afirmasi (KETM)</option>
            <option value="Prestasi">Prestasi Rapor / Kejuaraan</option>
            <option value="Perpindahan Orang Tua">Perpindahan Orang Tua / Anak Guru</option>
          </select>
        </div>
      </div>

      <!-- Data Ortu -->
      <div class="space-y-4 pt-4 border-t border-slate-100">
        <h3 class="text-sm font-bold text-blue-900 uppercase tracking-wider">3. Kontak Orang Tua / Wali</h3>
        
        <div>
          <label class="block text-sm font-semibold mb-1">Nama Orang Tua / Wali</label>
          <input type="text" name="nama_ortu" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
        </div>

        <div>
          <label class="block text-sm font-semibold mb-1">No. WhatsApp Aktif</label>
          <input type="tel" name="no_hp" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" placeholder="08xxxxxxxxxx" required>
        </div>
      </div>

      <div class="pt-6">
        <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium py-3 rounded-lg text-sm transition">
          Kirim Data Pendaftaran
        </button>
      </div>

    </form>
  </div>
</div>
{% endblock %}
