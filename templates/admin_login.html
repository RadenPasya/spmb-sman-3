{% extends 'base.html' %}
{% block title %}Login Panitia - SMAN 3 Tambun Selatan{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
  <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 md:p-8">
    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-slate-900">Login Panitia SPCM</h2>
      <p class="text-xs text-slate-500 mt-1">Khusus petugas verifikasi SMAN 3 Tambun Selatan</p>
    </div>

    <form action="/admin/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold mb-1">Username</label>
        <input type="text" name="username" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
      </div>
      <div>
        <label class="block text-sm font-semibold mb-1">Password</label>
        <input type="password" name="password" class="w-full px-3 py-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-blue-900" required>
      </div>
      <button type="submit" class="w-full bg-blue-900 hover:bg-blue-800 text-white font-medium py-2 rounded-lg text-sm transition">
        Masuk Dashboard
      </button>
    </form>
  </div>
</div>
{% endblock %}
